<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f6edb">
  <title>Teamwork Chores Offline</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/teamwork-chores-icon.svg" type="image/svg+xml">
  <style>
    :root {
      --ink: #202124;
      --muted: #667085;
      --line: #d8dee8;
      --blue: #2f6edb;
      --paper: #f5f7fb;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #fbfcfe 0%, #eef3f8 100%);
    }

    main {
      width: min(560px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      box-shadow: 0 18px 52px rgba(24, 49, 63, .13);
      padding: clamp(22px, 5vw, 38px);
    }

    img {
      width: 72px;
      height: 72px;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: clamp(30px, 6vw, 46px);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    a {
      display: inline-grid;
      place-items: center;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 7px;
      color: #fff;
      background: var(--blue);
      font-weight: 900;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/teamwork-chores-icon.svg" alt="">
    <h1>Offline</h1>
    <p>Teamwork Chores is installed, but this page was not available from the local cache. Reconnect and open the dashboard again to refresh the latest schedule.</p>
    <a href="/app">Try Dashboard</a>
  </main>
</body>
</html>
