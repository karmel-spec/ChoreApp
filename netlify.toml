[build]
  command = "npm run build"
  publish = "outputs"

[[redirects]]
  from = "/app"
  to = "/family-chore-dashboard-prototype.html"
  status = 200

[[redirects]]
  from = "/designs"
  to = "/chore-app-designs.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
